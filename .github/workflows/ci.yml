name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # the README's minimum
  JAVA_VERSION: 25
  NODE_VERSION: 24.21.0
  CLOJURE_CLI_VERSION: 1.12.6.1673
  BB_VERSION: 1.13.225

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Clojure CLI and babashka
        uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: ${{ env.CLOJURE_CLI_VERSION }}
          bb: ${{ env.BB_VERSION }}

      - name: Cache Maven and git deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ hashFiles('deps.edn', 'shadow-cljs.edn', 'bb.edn') }}

      - name: Lint (clj-kondo)
        env:
          CLJ_KONDO_VERSION: 2026.08.04
          CLJ_KONDO_SHA256: dd3bb3ec91bcb838e9bbefc9ba9968b69a8fe2a625fa67e8b0485605604e61d1
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo clj-kondo.zip "https://github.com/clj-kondo/clj-kondo/releases/download/v${CLJ_KONDO_VERSION}/clj-kondo-${CLJ_KONDO_VERSION}-linux-amd64.zip"
          echo "$CLJ_KONDO_SHA256  clj-kondo.zip" | sha256sum -c -
          unzip -q clj-kondo.zip clj-kondo
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/clj-kondo" --lint src test .github/actions/vuln-gate .clj-kondo/hammer

      - name: Vulnerability gate tests
        run: bb .github/actions/vuln-gate/gate_test.clj

      - run: npm ci

      - name: Backend tests
        run: bb test

      - name: Frontend tests
        run: npm test

      - name: Release jar runs the way bbin runs it
        run: bb jar:smoke

      - name: install.sh installs the jar and its launcher runs
        run: |
          tmp=$(mktemp -d)
          DINGSBUMS_HOME=$tmp/home DINGSBUMS_BIN=$tmp/bin DINGSBUMS_JAR=dist/dingsbums.jar bash install.sh
          DINGSBUMS_HOME=$tmp/home $tmp/bin/dingsbums --version

      - name: install-service.sh writes a valid unit and keeps its port
        run: |
          tmp=$(mktemp -d)
          mkdir $tmp/dist
          cp "$(command -v bb)" dist/dingsbums.jar $tmp/dist/
          cp install-service.sh $tmp/dist/install.sh
          export DINGSBUMS_PREFIX=$tmp/opt DINGSBUMS_UNIT_DIR=$tmp/units SYSTEMCTL=true
          bash $tmp/dist/install.sh
          grep -q -- "-m dingsbums.cli 8080$" $tmp/units/dingsbums.service
          bash $tmp/dist/install.sh 9000
          bash $tmp/dist/install.sh
          grep -x "ExecStart=$tmp/opt/bb -cp $tmp/opt/dingsbums.jar -m dingsbums.cli 9000" $tmp/units/dingsbums.service
          systemd-analyze verify $tmp/units/dingsbums.service
