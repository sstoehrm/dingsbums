name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  # the README's minimum
  JAVA_VERSION: 25
  # renovate: datasource=node-version depName=node versioning=node
  NODE_VERSION: 24.21.0
  # renovate: datasource=github-tags depName=clojure/brew-install versioning=loose
  CLOJURE_CLI_VERSION: 1.12.6.1673
  # renovate: datasource=github-releases depName=babashka/babashka extractVersion=^v(?<version>.*)$
  BB_VERSION: 1.13.225

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # the GitHub release
      id-token: write      # signing the provenance
      attestations: write  # storing it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Clojure CLI and babashka
        uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: ${{ env.CLOJURE_CLI_VERSION }}
          bb: ${{ env.BB_VERSION }}

      - name: Cache Maven and git deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ hashFiles('deps.edn', 'shadow-cljs.edn', 'bb.edn') }}

      - run: npm ci

      - name: Backend tests
        run: bb test

      - name: Frontend tests
        run: npm test

      - name: Build and smoke-test the jar
        run: bb jar:smoke ${{ github.ref_name }}

      - name: Build provenance for the jar
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/dingsbums.jar

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          dist/dingsbums.jar
          --title "dingsbums ${{ github.ref_name }}"
          --generate-notes
